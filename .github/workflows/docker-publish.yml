name: Build and Push Docker Image

on:
  workflow_run:
    workflows: [Quality]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: docker-publish-main
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - id: release
        run: node --experimental-strip-types scripts/release-metadata.mjs

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.release.outputs.state == 'published'

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: steps.release.outputs.state == 'published'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.release.outputs.state == 'published'
        with:
          context: .
          push: true
          tags: |
            firaskafri/helm-framework.com:latest
            firaskafri/helm-framework.com:${{ github.event.workflow_run.head_sha }}
            firaskafri/helm-framework.com:framework-${{ steps.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run check
        env:
          UPDATES_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success()
        with:
          name: helm-static-${{ github.sha }}
          path: dist/
          retention-days: 30
  container:
    name: container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker build --pull --build-arg RELEASE_ID=ci-verification -t helm-check .
      - run: docker run -d --name helm-check -p 8080:8080 helm-check
      - name: Check static serving and real 404 responses
        run: |
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail http://localhost:8080/ -o /dev/null
          curl --fail http://localhost:8080/practitioners -o /dev/null
          curl --fail http://localhost:8080/sitemap.xml -o /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/missing-page)" = "404"
          test "$(curl -fsSI http://localhost:8080/ | awk -F ': ' 'tolower($1) == "x-montra-release" { sub(/\r$/, "", $2); print $2 }')" = "ci-verification"
          test "$(docker inspect --format '{{ index .Config.Labels "com.montra2.release-id" }}' helm-check)" = "ci-verification"
          test "$(docker exec helm-check id -u)" != "0"
      - if: always()
        run: docker logs helm-check
